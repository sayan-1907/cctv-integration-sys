# Live Camera Configuration — Sentinel CCTV Grid
# Streams from https://cctv.corp8.cloud (corp8 public RTSP gateway)
# RTSP endpoint: rtsp://103.250.160.189:8554/stream/<id>
# HLS fallback:  https://cctv.corp8.cloud/<id>/index.m3u8

department_id: "SENTINEL-LIVE-01"
department_name: "Sentinel Camera Grid — Live Testing"

# IMPORTANT: Start with 4. Each stream = 1 OS process + OpenCV decode.
# Raise only after confirming CPU/RAM headroom with htop/Task Manager.
max_concurrent_streams: 10

target_decode_fps: 5
queue_max_size: 5

reconnect:
  initial_delay: 2
  max_delay: 30       # Sentinel guide recommends cap ~30s
  multiplier: 2
  jitter: 0.3

stall_timeout_seconds: 15

# Layer 2 — AI & Metadata Extraction
layer2:
  ai_worker_count: 2
  device: "cpu"
  yolo_model: "yolov8n.pt"
  ocr_engine: "fast_alpr"
  vehicle_confidence_threshold: 0.35
  ocr_confidence_threshold: 0.4
  snapshot_dir: "../snapshots"
  snapshot_max_width: 240
  plate_dedup_window_seconds: 10
  poll_interval_seconds: 0.05

# Layer 3 — Kafka (sqlite mode for local testing)
layer3:
  kafka_broker: "sqlite"
  kafka_topic: "traffic-anpr-alerts"
  kafka_spill_dir: "../kafka_spill"
  kafka_queue_size: 500
  kafka_retry_backoff_s: 5.0

